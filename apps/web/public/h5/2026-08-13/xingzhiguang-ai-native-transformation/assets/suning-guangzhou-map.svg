<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">河北肃宁到广州前端的供应链地图</title>
  <desc id="desc">河北肃宁源头工厂连接广州仓配前端，再连接全球客户的 AI Native 供应链路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08111e"/>
      <stop offset="100%" stop-color="#121a2a"/>
    </linearGradient>
    <linearGradient id="route" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#b6ff25"/>
      <stop offset="48%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff8a1d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="560" rx="36" fill="url(#bg)"/>
  <circle cx="122" cy="96" r="170" fill="#18324e" opacity=".45"/>
  <circle cx="780" cy="452" r="210" fill="#172d28" opacity=".5"/>
  <path d="M130 350 C250 155 430 108 548 228 C655 337 709 256 778 150" fill="none" stroke="url(#route)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M130 350 C250 155 430 108 548 228 C655 337 709 256 778 150" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="12 18" opacity=".52"/>
  <g font-family="PingFang SC, Arial, sans-serif">
    <g transform="translate(74 300)">
      <circle cx="56" cy="56" r="48" fill="#b6ff25" filter="url(#glow)"/>
      <text x="56" y="48" font-size="19" font-weight="900" text-anchor="middle" fill="#07111f">河北</text>
      <text x="56" y="76" font-size="25" font-weight="900" text-anchor="middle" fill="#07111f">肃宁</text>
      <text x="0" y="138" font-size="28" font-weight="900" fill="#f8fbff">源头制造</text>
      <text x="0" y="176" font-size="20" font-weight="700" fill="#9eb2ca">纱线 · 织布 · 染色 · 成衣</text>
    </g>
    <g transform="translate(396 162)">
      <rect x="0" y="0" width="170" height="112" rx="28" fill="#0f1726" stroke="#38bdf8" stroke-width="3"/>
      <text x="85" y="48" font-size="26" font-weight="900" text-anchor="middle" fill="#38bdf8">AI 中台</text>
      <text x="85" y="82" font-size="18" font-weight="700" text-anchor="middle" fill="#dbeafe">统一客户 / 库存 / 任务</text>
    </g>
    <g transform="translate(665 86)">
      <circle cx="56" cy="56" r="48" fill="#38bdf8" filter="url(#glow)"/>
      <text x="56" y="49" font-size="20" font-weight="900" text-anchor="middle" fill="#07111f">广州</text>
      <text x="56" y="76" font-size="22" font-weight="900" text-anchor="middle" fill="#07111f">前端</text>
      <text x="-14" y="138" font-size="28" font-weight="900" fill="#f8fbff">仓配与销售</text>
      <text x="-14" y="176" font-size="20" font-weight="700" fill="#9eb2ca">现货 · 内销 · 外贸 · 履约</text>
    </g>
    <g transform="translate(575 390)">
      <rect x="0" y="0" width="244" height="86" rx="28" fill="#111827" stroke="#ff8a1d" stroke-width="3"/>
      <text x="26" y="36" font-size="24" font-weight="900" fill="#ff8a1d">全球客户经营</text>
      <text x="26" y="66" font-size="18" font-weight="700" fill="#d8e1ef">B2B 询盘 · 报价 · 复购</text>
    </g>
    <text x="56" y="60" font-size="24" font-weight="900" fill="#f8fbff">供应链新路径</text>
    <text x="56" y="96" font-size="18" font-weight="700" fill="#94a3b8">不是把货从北方搬到南方，而是把数据、客户与库存统一到 AI 经营层。</text>
  </g>
</svg>
