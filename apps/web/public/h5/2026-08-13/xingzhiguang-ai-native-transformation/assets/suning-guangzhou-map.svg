<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">星之光河北制造与广州仓配销售双中心</title>
  <desc id="desc">河北负责标准制造，广州负责近客仓配和销售，以货号、批次、库存和异常台账连接</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#102230" stroke-opacity=".07"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#bb8b47"/></marker>
  </defs>
  <rect width="1400" height="700" fill="#f5f3ed"/>
  <rect width="1400" height="700" fill="url(#grid)"/>
  <text x="70" y="78" fill="#102230" font-family="Songti SC, STSong, serif" font-size="42" font-weight="700">双中心不是两套公司，是一套客户承诺</text>
  <text x="70" y="116" fill="#647480" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18">唯一货号 · 唯一批次 · 唯一库存 · 唯一异常责任</text>
  <g transform="translate(70 185)">
    <rect width="480" height="390" fill="#0c1d2b"/>
    <rect x="28" y="28" width="424" height="334" fill="none" stroke="#fff" stroke-opacity=".2"/>
    <text x="52" y="83" fill="#e4c995" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" letter-spacing="4">HEBEI · SU NING</text>
    <text x="52" y="145" fill="#fff" font-family="Songti SC, STSong, serif" font-size="44" font-weight="700">河北制造中心</text>
    <line x1="52" y1="176" x2="428" y2="176" stroke="#fff" stroke-opacity=".2"/>
    <g fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20">
      <text x="72" y="225">01 · 货号与金样</text><text x="72" y="270">02 · 批次与排产</text><text x="72" y="315">03 · 过程质量与入库</text>
    </g>
    <circle cx="50" cy="217" r="6" fill="#bb8b47"/><circle cx="50" cy="262" r="6" fill="#bb8b47"/><circle cx="50" cy="307" r="6" fill="#bb8b47"/>
  </g>
  <g transform="translate(850 185)">
    <rect width="480" height="390" fill="#2f695a"/>
    <rect x="28" y="28" width="424" height="334" fill="none" stroke="#fff" stroke-opacity=".24"/>
    <text x="52" y="83" fill="#e4c995" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" letter-spacing="4">GUANGZHOU</text>
    <text x="52" y="145" fill="#fff" font-family="Songti SC, STSong, serif" font-size="44" font-weight="700">广州履约中心</text>
    <line x1="52" y1="176" x2="428" y2="176" stroke="#fff" stroke-opacity=".24"/>
    <g fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20">
      <text x="72" y="225">01 · 客户与选款</text><text x="72" y="270">02 · 现货与补货</text><text x="72" y="315">03 · 发货与复购</text>
    </g>
    <circle cx="50" cy="217" r="6" fill="#e4c995"/><circle cx="50" cy="262" r="6" fill="#e4c995"/><circle cx="50" cy="307" r="6" fill="#e4c995"/>
  </g>
  <path d="M560 310H840" fill="none" stroke="#bb8b47" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M840 448H560" fill="none" stroke="#bb8b47" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(595 258)">
    <rect width="210" height="104" fill="#fff" stroke="#bb8b47"/>
    <text x="105" y="42" text-anchor="middle" fill="#102230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">标准 + 批次 + 库存</text>
    <text x="105" y="72" text-anchor="middle" fill="#647480" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15">生产事实向前端同步</text>
  </g>
  <g transform="translate(595 396)">
    <rect width="210" height="104" fill="#fff" stroke="#bb8b47"/>
    <text x="105" y="42" text-anchor="middle" fill="#102230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">订单 + 反馈 + 异常</text>
    <text x="105" y="72" text-anchor="middle" fill="#647480" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15">客户事实向工厂回流</text>
  </g>
  <text x="700" y="640" text-anchor="middle" fill="#aa4b3f" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">如果两端没有同一套事实，双中心只会增加沟通成本。</text>
</svg>
