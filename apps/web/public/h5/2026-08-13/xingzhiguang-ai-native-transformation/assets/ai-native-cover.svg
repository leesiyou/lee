<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">星之光 T 恤供应链 AI Native 转型诊断封面</title>
  <desc id="desc">深蓝工业背景，绿色 AI 中间层连接河北肃宁源头工厂、广州前端仓配和全球客户。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#02050a"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b9c4d6"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#243247" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity=".32"/>
  <circle cx="1000" cy="105" r="270" fill="#1b2d48" opacity=".35"/>
  <circle cx="168" cy="582" r="280" fill="#0e2f2c" opacity=".52"/>
  <path d="M86 514 C293 310 442 246 628 282 C815 318 912 180 1114 100" fill="none" stroke="#a8ff25" stroke-width="5" opacity=".76" filter="url(#glow)"/>
  <path d="M104 206 C296 338 486 372 676 338 C850 307 958 406 1096 540" fill="none" stroke="#38bdf8" stroke-width="4" opacity=".54"/>
  <g transform="translate(78 72)">
    <rect x="0" y="0" width="254" height="48" rx="24" fill="#b6ff25"/>
    <text x="26" y="32" font-family="PingFang SC, Arial, sans-serif" font-size="22" font-weight="800" fill="#07111f">AI NATIVE 诊断</text>
  </g>
  <text x="78" y="205" font-family="PingFang SC, Arial, sans-serif" font-size="34" font-weight="700" fill="#93a4bd" letter-spacing="3">星之光 T 恤供应链</text>
  <text x="78" y="292" font-family="PingFang SC, Arial, sans-serif" font-size="78" font-weight="900" fill="url(#silver)">从传统加工企业</text>
  <text x="78" y="384" font-family="PingFang SC, Arial, sans-serif" font-size="78" font-weight="900" fill="url(#silver)">到国际贸易组织</text>
  <text x="82" y="448" font-family="PingFang SC, Arial, sans-serif" font-size="34" font-weight="800" fill="#b6ff25">AI 不是工具，是公司的中间层</text>
  <g transform="translate(82 508)" font-family="PingFang SC, Arial, sans-serif">
    <rect x="0" y="0" width="220" height="56" rx="18" fill="#172438" stroke="#34445e"/>
    <text x="24" y="37" font-size="22" font-weight="700" fill="#f4f7fb">河北肃宁工厂</text>
    <rect x="244" y="0" width="220" height="56" rx="18" fill="#172438" stroke="#34445e"/>
    <text x="268" y="37" font-size="22" font-weight="700" fill="#f4f7fb">广州仓配前端</text>
    <rect x="488" y="0" width="220" height="56" rx="18" fill="#172438" stroke="#34445e"/>
    <text x="512" y="37" font-size="22" font-weight="700" fill="#f4f7fb">全球客户经营</text>
  </g>
  <g transform="translate(870 254)">
    <rect x="0" y="0" width="248" height="248" rx="44" fill="#0b1220" stroke="#b6ff25" stroke-width="3" opacity=".94"/>
    <text x="42" y="78" font-family="PingFang SC, Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff">BOSS</text>
    <text x="42" y="122" font-family="PingFang SC, Arial, sans-serif" font-size="54" font-weight="900" fill="#b6ff25">驾驶舱</text>
    <text x="42" y="166" font-family="PingFang SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#9ab0cc">客户 · 订单 · 库存</text>
    <text x="42" y="204" font-family="PingFang SC, Arial, sans-serif" font-size="23" font-weight="700" fill="#9ab0cc">人效 · 现金流</text>
  </g>
</svg>
