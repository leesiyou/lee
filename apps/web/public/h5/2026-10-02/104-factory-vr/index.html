<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>104 VR 工厂</title>
<style>
/* Layout: full-bleed 3D panorama; chrome floats at the four edges like a site badge on a hard hat. Single dark look, by choice. */
:root{
  --ink:#0c0e09;
  --panel:rgba(14,16,10,.78);
  --panel-solid:#15180f;
  --line:rgba(236,242,214,.16);
  --paper:#f2f5e8;
  --muted:#a4ab92;
  --neon:#d7f400;
  --neon-ink:#151a00;
  --display:"DIN Alternate","Avenir Next","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:absolute;inset:0;overflow:hidden;cursor:grab;background:var(--ink)}
#stage.drag{cursor:grabbing}
#cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.strip{position:absolute;left:0;top:0;background-repeat:no-repeat;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#veil{position:absolute;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .38s ease}
#veil.on{opacity:1}
#shade{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to bottom,rgba(8,9,6,.55),transparent 22%,transparent 72%,rgba(8,9,6,.6))}

/* hotspots */
#hs{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;will-change:transform}
.hs[hidden]{display:none!important}
.hs-info .dot{width:22px;height:22px;border-radius:50%;background:var(--neon);color:var(--neon-ink);display:grid;place-items:center;font:800 12px/1 var(--display);box-shadow:0 0 0 5px rgba(215,244,0,.22)}
.hs-info .lab{background:rgba(242,245,232,.94);color:#1a1d12;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.hs-info:hover .dot{box-shadow:0 0 0 8px rgba(215,244,0,.3)}
.hs-go{flex-direction:row}
.hs-go .ring{width:58px;height:58px;border-radius:50%;background:var(--neon);color:var(--neon-ink);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(12,14,9,.55),0 0 0 9px var(--neon);animation:pulse 2.2s ease-in-out infinite}
.hs-go .ring svg{width:26px;height:26px}
.hs-go .lab{font-weight:700;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* chrome */
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font:800 26px/1 var(--display);color:var(--neon);letter-spacing:-.02em}
.brand span{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--paper)}
#zones{display:flex;gap:4px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:4px;border-radius:999px;border:1px solid var(--line)}
#zones button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
#zones button.on{background:var(--neon);color:var(--neon-ink)}
.where{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 58px);max-width:min(420px,calc(100% - 32px));pointer-events:none}
.where .z{font:600 11px/1 var(--display);letter-spacing:.14em;color:var(--neon);text-transform:uppercase}
.where h1{margin:8px 0 4px;font-size:clamp(22px,4vw,30px);line-height:1.15;font-weight:800;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.where p{margin:0;font-size:13px;line-height:1.6;color:rgba(242,245,232,.82);text-shadow:0 1px 6px rgba(0,0,0,.7)}

.tools{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:8px}
.tool{width:44px;height:44px;border-radius:14px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);display:grid;place-items:center}
.tool svg{width:20px;height:20px}
.tool.on{background:var(--neon);color:var(--neon-ink);border-color:var(--neon)}

.bar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);padding:6px;border-radius:999px;white-space:nowrap}
.bar #prev{padding:10px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.bar #prev:disabled{opacity:.35;cursor:default}
.bar #count{font:600 13px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted);padding:0 8px}
.bar #count b{color:var(--paper)}
.bar #next{background:var(--neon);color:var(--neon-ink);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.bar svg{width:16px;height:16px}

.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.progress i{display:block;height:100%;background:var(--neon);transition:width .5s ease}

/* info card */
#card{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:min(340px,calc(100% - 92px));background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#card .k{font:600 10px/1 var(--display);letter-spacing:.16em;color:var(--neon)}
#card h3{margin:8px 0 6px;font-size:18px}
#card p{margin:0;font-size:14px;line-height:1.65;color:rgba(242,245,232,.86)}
#card .x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}

/* drawer */
#drawer{position:absolute;inset:0;background:rgba(8,9,6,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 30px);touch-action:pan-y}
#drawer .head{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 10px}
#drawer h2{margin:0;font:800 20px/1.2 var(--display)}
#drawer .close{padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600}
.zgroup{max-width:1100px;margin:22px auto 0}
.zgroup h4{margin:0 0 10px;font-size:14px;display:flex;gap:10px;align-items:baseline}
.zgroup h4 small{font:600 10px/1 var(--display);letter-spacing:.14em;color:var(--neon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{position:relative;text-align:left;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel-solid)}
.tile img{display:block;width:100%;aspect-ratio:2.6/1;object-fit:cover}
.tile .t{display:flex;gap:8px;align-items:center;padding:9px 11px;font-size:13px;font-weight:600}
.tile .n{font:600 11px/1 var(--display);color:var(--neon);font-variant-numeric:tabular-nums}
.tile.cur{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon)}

/* contact */
.brandrow{display:contents}
.brand{margin-right:auto}
.contact-btn{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;background:var(--paper);color:#1a1d12;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.contact-btn svg{width:15px;height:15px}
#contact{position:absolute;inset:0;background:rgba(8,9,6,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
#contact .sheet{position:relative;width:min(400px,100%);background:var(--panel-solid);border:1px solid var(--line);border-radius:22px;padding:24px 22px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#contact .k{font:700 11px/1 var(--display);letter-spacing:.16em;color:var(--neon)}
#contact h2{margin:10px 0 6px;font-size:22px}
#contact .sub{margin:0 0 18px;font-size:14px;line-height:1.6;color:rgba(242,245,232,.8)}
#contact .num{display:block;font:800 30px/1.1 var(--display);letter-spacing:.02em;color:var(--paper);font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
#contact .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
#contact .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 18px}
#contact .row a,#contact .row button{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:999px;font-size:14px;font-weight:800;text-decoration:none}
#contact .row svg{width:16px;height:16px;flex:none}
#contact .call{background:var(--neon);color:var(--neon-ink)}
#contact .copy{border:1px solid var(--line);color:var(--paper)}
#contact .addr{display:flex;gap:10px;align-items:center;padding-top:16px;border-top:1px solid var(--line);font-size:14px}
#contact .addr svg{width:18px;height:18px;color:var(--neon);flex:none}
#contact .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.hs-contact .ring{width:44px;height:44px;border-radius:50%;background:var(--paper);color:#1a1d12;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(242,245,232,.25)}
.hs-contact .ring svg{width:20px;height:20px}
.hs-contact .lab{font-weight:800;font-size:14px;background:var(--neon);color:var(--neon-ink);padding:6px 12px;border-radius:999px}
#intro .start2{width:100%;margin-top:8px;padding:12px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:700}
/* intro */
#intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:var(--panel-solid);border:1px solid var(--line);border-radius:22px;padding:24px 22px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#intro .big{font:800 44px/1 var(--display);color:var(--neon);letter-spacing:-.03em}
#intro h2{margin:6px 0 12px;font-size:20px}
#intro ul{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:rgba(242,245,232,.86)}
#intro li{display:flex;gap:10px;align-items:center}
#intro li i{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(215,244,0,.14);color:var(--neon);display:grid;place-items:center;font:700 11px/1 var(--display);font-style:normal}
#intro .start{width:100%;background:var(--neon);color:var(--neon-ink);padding:13px;border-radius:999px;font-size:15px;font-weight:800}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:600 12px/1 var(--display);letter-spacing:.14em;color:var(--neon);opacity:0;transition:opacity .2s}
#loading.on{opacity:1}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--paper);color:#1a1d12;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

@media (max-width:720px){
  .top{flex-direction:column;align-items:stretch;gap:10px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .contact-btn{padding:8px 13px}
  #zones{align-self:flex-start;max-width:100%;overflow-x:auto}
  #zones button{padding:7px 11px}
  .where{top:calc(env(safe-area-inset-top,0px) + 102px)}
  .where p{display:none}
  .bar{left:16px;transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  .bar #prev span{display:none}
  .tools{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  .tool{width:42px;height:42px}
  #card{bottom:calc(env(safe-area-inset-bottom,0px) + 80px);width:calc(100% - 92px)}
}
@media (prefers-reduced-motion:reduce){.hs-go .ring{animation:none}#veil{transition:none}}
</style>

</head>
<body>
<div id="app">
  <div id="stage"><div id="cam"></div></div>
  <div id="shade"></div>
  <div id="hs"></div>
  <div id="veil"></div>
  <div id="loading">LOADING</div>

  <header class="top">
    <div class="brandrow"><div class="brand"><b>104</b><span>集团 · VR 工厂</span></div><button class="contact-btn" id="bContact"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>联系工厂生产</button></div>
    <nav id="zones" aria-label="厂区"></nav>
  </header>
  <div class="where"><div class="z" id="zoneEn"></div><h1 id="stName"></h1><p id="stDesc"></p></div>

  <div class="tools">
    <button class="tool" id="bList" title="全部站点" aria-label="全部站点"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    <button class="tool" id="bAuto" title="自动环视" aria-label="自动环视"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    <button class="tool" id="bGyro" title="陀螺仪" aria-label="陀螺仪" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg></button>
    <button class="tool" id="bMusic" title="背景音乐" aria-label="背景音乐"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
    <button class="tool" id="bFull" title="全屏" aria-label="全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div class="bar">
    <button id="prev" aria-label="上一站"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg><span>上一站</span></button>
    <span id="count"></span>
    <button id="next">往前走 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="progress"><i id="prog"></i></div>

  <div id="card" hidden><div class="k" id="cardK"></div><h3 id="cardT"></h3><p id="cardP"></p><button class="x" id="cardX" aria-label="关闭">✕</button></div>

  <div id="drawer" hidden>
    <div class="head"><h2>全部站点</h2><button class="close" id="dClose">关闭</button></div>
    <div id="dBody"></div>
  </div>

  <div id="intro">
    <div class="big">104</div>
    <h2>集团 VR 工厂参观</h2>
    <ul>
      <li><i>1</i>拖动画面，环顾四周</li>
      <li><i>2</i>点黄色圆点，查看设备说明</li>
      <li><i>3</i>点「往前走」，进入下一站</li>
    </ul>
    <button class="start" id="startBtn">开始参观 · 播放音乐</button>
    <button class="start2" id="startContact">联系工厂生产</button>
  </div>
  <div id="contact" hidden>
    <div class="sheet" role="dialog" aria-labelledby="ctTitle">
      <button class="x" id="ctX" aria-label="关闭">✕</button>
      <div class="k">104 集团 · 工厂直供</div>
      <h2 id="ctTitle">联系工厂生产</h2>
      <p class="sub">印花、烫画、DTF 打印都在自家车间完成。来图定制、打样、批量生产，直接找工厂。</p>
      <div class="lbl">电话 / 微信（同号）</div>
      <span class="num" id="ctNum">190 6854 6281</span>
      <div class="row">
        <a class="call" href="tel:19068546281"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>拨打电话</a>
        <button class="copy" id="ctCopy">复制微信号</button>
      </div>
      <div class="addr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span>工厂地址：广州 · 番禺</span></div>
    </div>
  </div>
  <audio id="bgm" src="music/bgm.mp3" loop preload="auto"></audio>
  <div id="toast"></div>
</div>

<script src="app.js?v=20261002-csp" defer></script>

</body>
</html>
