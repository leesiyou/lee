name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Astro production build
        run: npm run build
      - name: Compose structure
        run: npm run check:compose
      - name: Compose interpolation
        run: docker compose --env-file infra/env.example -f infra/compose.yaml config --quiet
      - name: Docker image build
        run: docker build --build-arg BUILD_VERSION="ci-${GITHUB_SHA}" -f apps/web/Dockerfile -t lee-web:ci .
